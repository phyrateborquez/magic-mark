name: Validate
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm run lint:firefox
      - run: npm run package
      - run: npm run verify:archives
      - uses: actions/upload-artifact@v4
        with:
          name: magic-mark-unsigned
          path: |
            artifacts/*.zip
            artifacts/SHA256SUMS.txt
